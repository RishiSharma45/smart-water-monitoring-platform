apiVersion: 1

groups:
  - orgId: 1
    name: Smart Water Alerts
    folder: Smart Water Monitor
    interval: 1m
    rules:
      - uid: smart-water-service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: up{job=~"smart-water-.*"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: critical

      - uid: smart-water-api-errors
        title: API Error Rate
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(smart_water_http_errors_total[5m])) > 0.1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
