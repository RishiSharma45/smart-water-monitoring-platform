server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/users {
        proxy_pass http://user-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/tanks {
        proxy_pass http://tank-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/alerts {
        proxy_pass http://notification-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health/user {
        proxy_pass http://user-service:3000/health/ready;
        proxy_set_header Host $host;
    }

    location = /health/tank {
        proxy_pass http://tank-service:3001/health/ready;
        proxy_set_header Host $host;
    }

    location = /health/notification {
        proxy_pass http://notification-service:3002/health/ready;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
