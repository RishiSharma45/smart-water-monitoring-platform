apiVersion: v1
kind: ServiceAccount

metadata:
  name: promtail
  namespace: smart-water
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: smart-water-promtail

rules:
- apiGroups: [""]
  resources:
  - pods
  - nodes
  - nodes/proxy
  - services
  - endpoints
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: smart-water-promtail

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smart-water-promtail

subjects:
- kind: ServiceAccount
  name: promtail
  namespace: smart-water
---
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: promtail
  namespace: smart-water

spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      serviceAccountName: promtail

      containers:
      - name: promtail
        image: grafana/promtail:3.2.1
        args:
        - -config.file=/etc/promtail/promtail.yml

        readinessProbe:
          httpGet:
            path: /ready
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /ready
            port: 9080
          initialDelaySeconds: 20
          periodSeconds: 20

        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: promtail-config
  namespace: smart-water

data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yml

    clients:
      - url: http://loki-service:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
