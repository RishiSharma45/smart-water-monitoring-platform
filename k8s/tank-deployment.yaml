apiVersion: apps/v1
kind: Deployment

metadata:
  name: tank-service
  namespace: smart-water

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tank-service

  template:
    metadata:
      labels:
        app: tank-service

    spec:
      containers:
      - name: tank-service

        # Jenkins overrides this with smart-water-monitor-tank-service:${BUILD_NUMBER}.
        image: smart-water-monitor-tank-service:dev

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3001

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 15

        env:
        - name: PORT
          value: "3001"

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_PASSWORD

        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3002"
