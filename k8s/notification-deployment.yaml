apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespace: smart-water

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
      - name: notification-service

        image: smart-water-monitor-notification-service:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 3002

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 20
          periodSeconds: 15

        env:
        - name: PORT
          value: "3002"

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_PASSWORD

        - name: EMAIL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: EMAIL_ENABLED

        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: SMTP_HOST

        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: SMTP_PORT

        - name: SMTP_SECURE
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: SMTP_SECURE

        - name: ALERT_EMAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: ALERT_EMAIL_FROM

        - name: ALERT_EMAIL_TO
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: ALERT_EMAIL_TO

        - name: SLACK_ENABLED
          valueFrom:
            configMapKeyRef:
              name: smart-water-config
              key: SLACK_ENABLED

        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: SMTP_USER

        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: SMTP_PASSWORD

        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: SLACK_WEBHOOK_URL
