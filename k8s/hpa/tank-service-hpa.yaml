apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: tank-service-hpa
  namespace: smart-water

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tank-service

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
