apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-exporter
  namespace: smart-water

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
      - name: postgres-exporter

        image: prometheuscommunity/postgres-exporter:v0.16.0

        ports:
        - containerPort: 9187

        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 20
          periodSeconds: 20

        env:
        - name: DATA_SOURCE_URI
          value: postgres-service:5432/waterdb?sslmode=disable

        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_USER

        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_PASSWORD

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
