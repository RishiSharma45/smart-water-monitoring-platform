apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: smart-water

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres

        image: postgres:16

        ports:
        - containerPort: 5432

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 20

        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smart-water-secret
              key: DB_PASSWORD

        - name: POSTGRES_DB
          value: waterdb

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

        - name: postgres-init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

      - name: postgres-init-scripts
        configMap:
          name: postgres-init-scripts
